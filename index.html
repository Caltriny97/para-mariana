<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1E0F2B">
  <title>Para Mariana</title>
  <meta name="description" content="Uma carta que só uma pessoa no mundo sabe abrir.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Para Mariana 💜">
  <meta property="og:description" content="Uma carta que só uma pessoa no mundo sabe abrir.">
  <meta property="og:url" content="https://caltriny97.github.io/para-mariana/">
  <meta property="og:image" content="https://caltriny97.github.io/para-mariana/assets/img/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Um envelope lilás com selo de cera vinho: uma carta para Mariana">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://caltriny97.github.io/para-mariana/assets/img/og.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/great-vibes-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="travado">
  <canvas id="ceu-fundo" aria-hidden="true"></canvas>
  <div class="progresso" id="progresso" aria-hidden="true"></div>

  <section class="portao" id="portao" aria-label="Fechadura da carta">
    <div class="portao-miolo">
      <p class="portao-para">uma carta para</p>
      <h1 class="portao-nome">Mariana</h1>

      <div class="envelope" id="envelope">
        <div class="env-costas"></div>
        <div class="env-carta"><span class="env-carta-texto">com amor</span></div>
        <div class="env-sombra env-sombra-lados"><div class="env-aba env-aba-esq"></div><div class="env-aba env-aba-dir"></div></div>
        <div class="env-sombra env-sombra-baixo"><div class="env-aba env-aba-baixo"></div></div>
        <div class="env-sombra env-sombra-topo"><div class="env-aba env-aba-topo"></div></div>
        <button class="selo" id="selo" type="button" aria-label="Quebrar o selo e abrir a carta" disabled>
          <span class="selo-cera"></span>
          <span class="selo-metade selo-esq"><span>M</span></span>
          <span class="selo-metade selo-dir"><span>M</span></span>
        </button>
      </div>

      <form class="fechadura" id="fechadura" autocomplete="off" novalidate>
        <p class="fechadura-frase">Só existe uma pessoa no mundo que sabe abrir esta carta.</p>
        <label class="fechadura-pergunta" for="dia">Em que dia tudo começou?</label>
        <div class="fechadura-campos">
          <input id="dia" name="dia" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="dia" aria-label="Dia" autocomplete="off">
          <span class="barra" aria-hidden="true">/</span>
          <input id="mes" name="mes" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="mês" aria-label="Mês" autocomplete="off">
        </div>
        <button class="botao" id="abrir" type="submit">Abrir</button>
        <p class="fechadura-dica" id="dica" role="status" aria-live="polite"></p>
      </form>

      <div class="boasvindas" id="boasvindas" hidden>
        <p class="boasvindas-frase"></p>
        <p class="boasvindas-toque"></p>
      </div>
    </div>
  </section>

  <main id="conteudo" hidden></main>

  <button class="botao-musica" id="musica" type="button" aria-label="Pausar a música" aria-pressed="true" hidden>
    <span class="barras" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden></div>
  <div class="sobreposicao" id="sobreposicao" role="dialog" aria-modal="true" hidden></div>
  <canvas class="festa" id="festa" aria-hidden="true"></canvas>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <noscript><p class="sem-js">Para abrir esta carta, ative o JavaScript do navegador.</p></noscript>

  <script src="vault/v.js"></script>
  <script src="assets/js/nome.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
